[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "masterclaw"
version = "2.0.0.dev0"
description = "Deterministic Discord game-master orchestration on OpenHands SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "discord.py>=2.5,<3",
  # OpenHands 1.33 allows newer LiteLLM releases, but 1.92.0 has no usable
  # Windows/Python 3.12 wheel and attempts a Rust source build during install.
  "litellm==1.84.1",
  # Compatibility set from the upstream OpenHands SDK v1.33.0 uv.lock. Without
  # it, current FastMCP/Laminar/OpenTelemetry releases are not co-resolvable.
  "fastmcp==3.2.0",
  "lmnr==0.7.47",
  "mcp==1.26.0",
  "opentelemetry-api==1.39.1",
  "opentelemetry-instrumentation==0.60b1",
  "opentelemetry-instrumentation-threading==0.60b1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-semantic-conventions==0.60b1",
  "openhands-sdk==1.33.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
masterclaw = "masterclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/masterclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
