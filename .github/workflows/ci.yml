name: v2-ci

on:
  push:
    branches: [main, develop-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked --extra dev
      - run: uv run python -m ruff check src tests
      - run: uv run python -m ruff format --check src tests
      - run: uv run python -m pytest --cov=masterclaw --cov-report=term-missing -q
      - run: uv run masterclaw doctor
        env:
          MASTERCLAW_DISCORD_TOKEN: ci-placeholder
          MASTERCLAW_OPENROUTER_API_KEY: ci-placeholder
          MASTERCLAW_DATABASE_PATH: ${{ runner.temp }}/masterclaw.sqlite3
          MASTERCLAW_STATE_MODEL__MODEL: openrouter/openai/gpt-4.1-mini
          MASTERCLAW_REASONING_MODEL__MODEL: openrouter/openai/gpt-4.1-mini
          MASTERCLAW_NARRATIVE_MODEL__MODEL: openrouter/openai/gpt-4.1-mini
          MASTERCLAW_WORLDGEN_MODEL__MODEL: openrouter/openai/gpt-4.1-mini
          OPENHANDS_SUPPRESS_BANNER: "1"

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t masterclaw-v2:test .
      - run: >-
          docker run --rm
          -e MASTERCLAW_DISCORD_TOKEN=ci-placeholder
          -e MASTERCLAW_OPENROUTER_API_KEY=ci-placeholder
          -e MASTERCLAW_DATABASE_PATH=/tmp/masterclaw.sqlite3
          -e MASTERCLAW_STATE_MODEL__MODEL=openrouter/openai/gpt-4.1-mini
          -e MASTERCLAW_REASONING_MODEL__MODEL=openrouter/openai/gpt-4.1-mini
          -e MASTERCLAW_NARRATIVE_MODEL__MODEL=openrouter/openai/gpt-4.1-mini
          -e MASTERCLAW_WORLDGEN_MODEL__MODEL=openrouter/openai/gpt-4.1-mini
          masterclaw-v2:test masterclaw doctor
