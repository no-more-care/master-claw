services:
  masterclaw:
    build: .
    restart: unless-stopped
    env_file: .env
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "masterclaw", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - masterclaw-data:/app/data

volumes:
  masterclaw-data:
